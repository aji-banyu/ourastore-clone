<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- box icon linking -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- My CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Logo icon -->
    <link rel="icon" type="image/x-icon" href="logo/logoPNG.png">
    
    <title>OURASTORE-CLONE</title>
</head>
<body>

    <!-- header section start -->
    <header>
        <div class="top">
            <div class="logo">
                <div class="logo-img">
                    <img src="logo/logoPNG.png" alt="">
                </div>
                <p>Pham<span>.Id</span></p>
            </div>
            
            <div class="search-input">
                <i class='bx bx-search'></i>
                <input type="text" placeholder="Cari Game atau Voucher">
            </div>
            
            <div class="language-wrapper">
                <div class="lang-img">
                    <img src="images/flag.png" alt="">
                </div>
                <div class="lang-text">ID/IDR</div>
            </div>
        </div>

        <nav>
            <div class="navbar">
                <div class="nav-link">
                    <div class="nav-item active">
                        <i class='bx bx-shopping-bag'></i>
                        <h6>Topup</h6>
                    </div>
                    <div class="nav-item">
                        <i class='bx bx-file-find' ></i>
                        <h6>Cek Transaksi</h6>
                    </div>
                    <div class="nav-item">
                        <i class='bx bx-bar-chart-alt-2' ></i>
                        <h6>Leaderboard</h6>
                    </div>
                </div>

                <div class="log-regist">
                    <div class="nav-item">
                        <i class='bx bx-log-in'></i>
                        <h6>Masuk</h6>
                    </div>
                    <div class="nav-item">
                        <i class='bx bx-user-plus'></i>
                        <h6>Daftar</h6>
                    </div>
                </div>
            </div>
        </nav>
    </header>
    <!-- header section end -->

    <!-- Crousel start -->
    <div class="carousel">

        <div class="slide-container">
            <div class="slides">
                <img src="images/img-1.jpg" class="active">
                <img src="images/img-2.jpg">
                <img src="images/img-3.jpg">
                <img src="images/img-4.jpg">
                <img src="images/img-5.jpg">
            </div>

            <div class="buttons">
                <span class="prev">&#10094;</span>
                <span class="next">&#10095;</span>
            </div>

        </div>
        
    </div>
    <!-- Crousel end -->




    <!-- script -->
    <script src="app.js"></script>
</body>
</html>
